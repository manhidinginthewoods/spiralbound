<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiralbound</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <div class="game-header">
    <div class="game-title">SPIRAL<span>BOUND</span></div>
    <div class="header-stats">
    </div>
  </div>

  <!-- RESOURCE BARS -->
  <div class="resource-panel">
    <div class="resource-bar">
      <div class="bar-label"><span>HP</span><span id="hp-text">400/400</span></div>
      <div class="bar-track"><div class="bar-fill hp" id="hp-fill" style="width:100%"></div></div>
    </div>
    <div class="resource-bar">
      <div class="bar-label"><span>Mana</span><span id="mana-text">15/15</span></div>
      <div class="bar-track"><div class="bar-fill mana" id="mana-fill" style="width:100%"></div></div>
    </div>
    <div class="pip-display" id="pip-container">
      <span class="pip-label">Pips:</span>
    </div>
  </div>

  <!-- TAB BAR -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="gear" onclick="switchTab('gear')">Wizard</button>
    <button class="tab-btn" data-tab="combat" onclick="switchTab('combat')">Combat</button>
    <button class="tab-btn" data-tab="deck" onclick="switchTab('deck')">Spellbook</button>
    <button class="tab-btn" data-tab="shop" onclick="switchTab('shop')">Shop</button>
    <button class="tab-btn" data-tab="craft" onclick="switchTab('craft')">Craft</button>
    <button class="tab-btn" data-tab="garden" onclick="switchTab('garden')">Garden</button>
    <button class="tab-btn" data-tab="pet" onclick="switchTab('pet')">Pet</button>
    <button class="tab-btn" data-tab="map" onclick="switchTab('map')">Map</button>
  </div>

  <!-- ===== WIZARD TAB (was Hub + Gear) ===== -->
  <div class="tab-content active" id="tab-gear">
    <div id="wizard-status"></div>
    <div id="wizard-profile"></div>
    <div class="section-head" style="margin-top:12px">Equipped Gear</div>
    <div id="gear-equipped"></div>
    <div class="status-box" style="margin-top:12px">
      <h3>Activity Log</h3>
      <div class="combat-log" id="hub-log" style="height:160px"></div>
    </div>
    <div class="section-head" style="margin-top:12px">Inventory</div>
    <div id="gear-inventory"></div>
    <div class="status-box" style="margin-top:12px">
      <h3>Quick Actions</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="saveGame(); addHubLog('Game saved.', 'system'); updateUI();">Save</button>
        <button class="btn" onclick="if(confirm('Reset all progress?')) resetGame();">Reset</button>
        <button class="btn" onclick="document.getElementById('dev-menu').style.display=document.getElementById('dev-menu').style.display==='none'?'block':'none'">Dev Menu</button>
      </div>
    </div>
    <div class="status-box" id="dev-menu" style="display:none">
      <h3>Dev / Testing</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn" onclick="Game.gold+=500;updateUI();">+500 Gold</button>
        <button class="btn" onclick="Game.gold+=5000;updateUI();">+5000 Gold</button>
        <button class="btn" onclick="Game.snacks+=50;updateUI();">+50 Snacks</button>
        <button class="btn" onclick="for(var t of REAGENT_IDS)Game.reagents[t]=(Game.reagents[t]||0)+20;updateUI();">+20 Each Reagent</button>
        <button class="btn" onclick="Game.wizard.trainingPoints=(Game.wizard.trainingPoints||0)+5;updateUI();">+5 TP</button>
        <button class="btn" onclick="Game.wizard.hp=Game.wizard.maxHp;Game.wizard.mana=Game.wizard.maxMana;updateUI();">Full Heal</button>
        <button class="btn" onclick="devSkipZone()">Skip Zone</button>
        <button class="btn" onclick="devSkipWorld()">Skip World</button>
        <button class="btn" onclick="devUnlockAll()">Unlock All</button>
        <button class="btn" onclick="devAddSeeds()">+5 Each Seed</button>
        <button class="btn" onclick="devKillEnemies()">Kill Enemies</button>
        <button class="btn" onclick="Game.crafting.rank=Math.min(Game.crafting.rank+1,CRAFTING_RANKS.length-1);addLog('DEV: Crafting rank → '+CRAFTING_RANKS[Game.crafting.rank],'system');updateUI();">Crafting Rank Up</button>
        <button class="btn" onclick="Game.crafting.inventory.enchantments.push('keen_edge','sharp_edge','brilliant_edge','precision','greater_precision','efficiency');addLog('DEV: +1 of each enchantment','system');updateUI();">+All Enchantments</button>
        <button class="btn" onclick="Game.crafting.inventory.jewels.push('ruby','sapphire','emerald','citrine','opal');addLog('DEV: +1 of each jewel','system');updateUI();">+All Jewels</button>
        <button class="btn" onclick="if(Game.pet){Game.pet.stageIndex=6;Game.pet.xp=6000;for(var mi=0;mi<Game.pet.talentPool.length&&Game.pet.manifested.length<5;mi++){if(Game.pet.manifested.indexOf(Game.pet.talentPool[mi])===-1)Game.pet.manifested.push(Game.pet.talentPool[mi]);}addLog('DEV: '+Game.pet.name+' → Ultra (all talents)','system');recalcStats();updateUI();}else if(Game.petRoster.length>0){var p=Game.petRoster[0];p.stageIndex=6;p.xp=6000;Game.pet=p;recalcStats();updateUI();}">Max Pet Stage</button>
        <button class="btn" onclick="generateEvent();updateUI();">Force Event</button>
        <button class="btn" onclick="Game.wizard.rankIndex=RANKS.length-2;rankUp();Game.wizard.hp=Game.wizard.maxHp;Game.wizard.mana=Game.wizard.maxMana;updateUI();">Max Rank</button>
      </div>
    </div>
  </div>

  <!-- ===== COMBAT TAB ===== -->
  <div class="tab-content" id="tab-combat">
    <div id="boss-alert" style="display:none;background:var(--bg-card);border:2px solid var(--gold);border-radius:4px;padding:16px;margin-bottom:12px;text-align:center">
      <div style="font-size:14px;color:var(--gold);margin-bottom:8px" id="boss-alert-text">Boss ahead!</div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:12px" id="boss-alert-detail"></div>
      <button class="btn primary" onclick="startBossFight()" style="font-size:13px;padding:6px 20px">Begin Fight</button>
    </div>
    <div class="section-head">Enemies</div>
    <div class="enemy-panel" id="enemy-panel"></div>

    <div class="section-head" style="margin-top:12px">Combat Log</div>
    <div class="combat-log" id="combat-log"></div>

    <div class="combat-controls">
      <button class="btn" id="mode-btn" onclick="toggleMode()">⚙ AUTO</button>
      <span id="phase-display" style="font-size:12px;padding:6px;color:var(--text-dim)"></span>
    </div>

    <div class="spell-hand" id="spell-hand" style="display:none"></div>
  </div>

  <!-- ===== SPELLBOOK TAB ===== -->
  <div class="tab-content" id="tab-deck">
    <div id="spellbook-content"></div>
  </div>

  <!-- ===== SHOP TAB ===== -->
  <div class="tab-content" id="tab-shop">
    <div class="section-head" id="shop-title">Shop</div>
    <div id="shop-vendor"></div>

    <div class="section-head" style="margin-top:16px" id="bazaar-title">Bazaar</div>
    <p style="font-size:11px;color:var(--text-dim);margin-bottom:8px">Items from all worlds you've visited.</p>
    <div id="shop-bazaar"></div>
  </div>

  <!-- ===== CRAFT TAB ===== -->
  <div class="tab-content" id="tab-craft">
    <div id="craft-content"></div>
  </div>

  <!-- ===== GARDEN TAB ===== -->
  <div class="tab-content" id="tab-garden">
    <div id="garden-content"></div>
  </div>

  <!-- ===== PET TAB ===== -->
  <div class="tab-content" id="tab-pet">
    <div id="pet-content"></div>
  </div>

  <!-- ===== MAP TAB ===== -->
  <div class="tab-content" id="tab-map">
    <div class="world-map" id="world-map"></div>
  </div>

  <script src="game.js"></script>
  <script src="ui.js"></script>
  <script>
    // Boot
    window.addEventListener('load', () => {
      try {
        if (!loadGame()) {
          initGame();
        } else {
          // Resume
          addLog('Save loaded. Resuming...', 'system');
          if (Game.state === 'fighting' || Game.state === 'resting') {
            if (Game.tickInterval) clearInterval(Game.tickInterval);
            Game.tickInterval = setInterval(gameTick, Game.TICK_MS);
            if (Game.state === 'fighting' && !Game.combat) {
              startEncounter();
            }
          }
          updateUI();
        }
      } catch(e) {
        console.error('Boot error:', e);
        document.getElementById('hub-status').textContent = 'Save corrupted. Resetting...';
        localStorage.removeItem('spiralbound_save');
        setTimeout(function(){ location.reload(); }, 500);
      }
    });
  </script>

</body>
</html>
